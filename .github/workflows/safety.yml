name: Autopilot Safety Checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run runner safety regression tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Scan for accidentally committed private keys
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, sys
          bad=[]
          for p in Path('.').rglob('*'):
              if not p.is_file() or '.git' in p.parts or p.stat().st_size > 500_000: continue
              if p.suffix.lower() not in {'.py','.md','.yml','.yaml','.json','.toml','.txt','.env','.ps1'}: continue
              s=p.read_text(errors='replace')
              if re.search(r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----',s): bad.append(str(p))
          if bad:
              print('Potential private keys:', bad);sys.exit(1)
          print('Basic private-key scan passed; not a comprehensive secret scanner')
          PY
